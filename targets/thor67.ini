[env:Thor67_ESP_RX_Backpack_via_UART]
extends = env_common_esp8285, thor67_vrx_backpack_common
build_flags =
	${env_common_esp8285.build_flags}
	${thor67_vrx_backpack_common.build_flags}
	-D PIN_LED=16
	-D PIN_MOSI=3	;RX pad
	-D PIN_CLK=0 	;Boot pad
	-D PIN_CS=1		;TX pad
	-D OFFSET_MHZ=0

[env:Thor67_ESP_RX_Backpack_via_WIFI]
extends = env:Thor67_ESP_RX_Backpack_via_UART

[env:Thor67_ESP32C3_Backpack_via_UART]
extends = env_common_esp32c3, thor67_vrx_backpack_common
build_flags =
	${env_common_esp32c3.build_flags}
	${thor67_vrx_backpack_common.build_flags}
	-D PIN_LED=8
	-D PIN_MOSI=7
	-D PIN_CLK=5
	-D PIN_CS=6
	-D OFFSET_MHZ=0
