[env:RUSHFPV_7G2_ESP32C3_Backpack_via_UART]
extends = env_common_esp32c3, rushfpv_7G2_vrx_backpack_common
build_flags =
	${env_common_esp32c3.build_flags}
	${rushfpv_7G2_vrx_backpack_common.build_flags}
	-D PIN_LED=8
	-D PIN_MOSI=7
	-D PIN_CLK=5
	-D PIN_CS=6
    -D PIN_SDA=9
    -D PIN_SCL=10
	-D PIN_DUAL_MODE=20
	-D USE_6G_MODE=0
	-D ENABLE_DISPLAY=1
	-D DUAL_MODE=0

